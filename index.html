<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
</head>
<body style="background-color: black; color: white; font-family: sans-serif; margin: 0; padding: 20px;">

    <div id="content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <h1 style="color: #FF5F1F; text-align: center;">Let's Slaughter Crypto</h1>
        
        <button id="ready-btn" style="width: 100%; padding: 20px; font-size: 20px; background-color: #FF5F1F; color: white; border: none; font-weight: bold; margin-bottom: 20px;">I'm ready!</button>
        
        <button id="not-yet-btn" style="width: 100%; padding: 20px; font-size: 20px; background-color: #FF1493; color: white; border: none; font-weight: bold;">Not yet</button>
    </div>

    <script>
        document.getElementById("ready-btn").onclick = function() {
            document.getElementById("content").innerHTML = '<h1 style="color: #FF1493; text-align: center;">Time Page</h1>';
        };
        document.getElementById("not-yet-btn").onclick = function() {
            document.getElementById("content").innerHTML = '<h1 style="color: white; text-align: center;">Application Closed</h1>';
        };
    </script>
</body>
</html>
