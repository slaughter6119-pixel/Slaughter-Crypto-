<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <style>
        body { background-color: black; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .header { text-align: center; color: #FF1493; font-size: 24px; margin-bottom: 10px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .main-layout { display: flex; justify-content: space-between; }
        .left-col { width: 55%; }
        .right-col { width: 40%; display: flex; flex-direction: column; gap: 10px; }
        .control-btn { padding: 10px; background-color: #8B0000; border: none; color: white; font-weight: bold; }
        .accuracy-section { text-align: center; margin-top: 10px; color: #FF5F1F; font-weight: bold; }
        .teal { color: #008080; }
        .green { color: #00FF00; }
    </style>
</head>
<body>
    <h1 class="header">Results</h1>
    
    <div class="top-row">
        <span>Reset time: 17:00</span>
        <span>Time until reset: 2hrs 30min</span>
    </div>

    <div class="main-layout">
        <div class="left-col">
            <p>Investment: $2.52</p>
            <p class="green">Profit: $0.25</p>
            <br>
            <p>Currency: <span class="teal">Determining...</span></p>
            <p>Current: <span class="teal">Determining...</span></p>
            <p>Buy: <span class="teal">Determining...</span></p>
            <p>Sell: <span class="teal">Determining...</span></p>
            <br>
            <div class="accuracy-section">Accuracy</div>
            <br>
            <p>Todays: <span class="teal">Determining...</span></p>
            <p>Total: <span class="teal">Determining...</span></p>
        </div>
        
        <div class="right-col">
            <button class="control-btn">Time reset</button>
            <button class="control-btn">$$ Reset $$</button>
            <button class="control-btn">New pick</button>
        </div>
    </div>
</body>
</html>
